<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BüfeOS - Ana Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-store text-3xl"></i>
                    <div>
                        <h1 class="text-2xl font-bold">BüfeOS</h1>
                        <p class="text-blue-200 text-sm">Büfe Yönetim Sistemi</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-sm" id="current-date"></p>
                    <p class="text-xs text-blue-200" id="current-time"></p>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-white shadow-md mb-6">
        <div class="container mx-auto px-4">
            <div class="flex overflow-x-auto space-x-4 py-3">
                <a href="index.html" class="nav-link active px-4 py-2 rounded-lg bg-blue-600 text-white whitespace-nowrap">
                    <i class="fas fa-home mr-2"></i>Ana Panel
                </a>
                <a href="sales.html" class="nav-link px-4 py-2 rounded-lg hover:bg-gray-100 whitespace-nowrap">
                    <i class="fas fa-cash-register mr-2"></i>Hızlı Satış
                </a>
                <a href="products.html" class="nav-link px-4 py-2 rounded-lg hover:bg-gray-100 whitespace-nowrap">
                    <i class="fas fa-boxes mr-2"></i>Ürünler
                </a>
                <a href="orders.html" class="nav-link px-4 py-2 rounded-lg hover:bg-gray-100 whitespace-nowrap">
                    <i class="fas fa-clipboard-list mr-2"></i>Sipariş Listesi
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pb-8">
        <!-- Dashboard Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

            <!-- Card 1: Bugünkü Satış -->
            <div class="card bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">💰 Bugünkü Satış</h2>
                    <span id="sales-change" class="text-sm font-bold text-green-600"></span>
                </div>
                <div class="space-y-3">
                    <div>
                        <p class="text-3xl font-bold text-blue-600" id="today-sales">0 ₺</p>
                        <p class="text-sm text-gray-500">Toplam Satış</p>
                    </div>
                    <div class="flex justify-between pt-3 border-t">
                        <div>
                            <p class="text-xl font-semibold text-green-600" id="today-profit">0 ₺</p>
                            <p class="text-xs text-gray-500">Kar</p>
                        </div>
                        <div>
                            <p class="text-xl font-semibold text-gray-700" id="today-transactions">0</p>
                            <p class="text-xs text-gray-500">İşlem</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 2: Stok Uyarıları -->
            <div class="card bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">⚠️ Az Kalanlar</h2>
                    <span class="bg-red-100 text-red-600 px-2 py-1 rounded-full text-xs font-bold" id="low-stock-count">0</span>
                </div>
                <div id="low-stock-list" class="space-y-2 max-h-48 overflow-y-auto">
                    <!-- Dinamik yüklenecek -->
                </div>
            </div>

            <!-- Card 3: En Çok Satanlar -->
            <div class="card bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">🔥 En Çok Satanlar</h2>
                    <span class="text-xs text-gray-500">Bugün</span>
                </div>
                <div id="top-selling-list" class="space-y-2 max-h-48 overflow-y-auto">
                    <!-- Dinamik yüklenecek -->
                </div>
            </div>
        </div>

        <!-- Son Satışlar -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-gray-700">
                    <i class="fas fa-receipt mr-2"></i>Son Satışlar
                </h2>
                <button onclick="loadRecentSales()" class="text-blue-600 hover:text-blue-800">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600">Ürün</th>
                            <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600">Adet</th>
                            <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600">Tutar</th>
                            <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600">Kar</th>
                            <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600">Zaman</th>
                        </tr>
                    </thead>
                    <tbody id="recent-sales-table">
                        <!-- Dinamik yüklenecek -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script>
        const API_URL = 'http://localhost:8000';

        // Zaman göster
        function updateTime() {
            const now = new Date();
            document.getElementById('current-date').textContent = now.toLocaleDateString('tr-TR', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
            document.getElementById('current-time').textContent = now.toLocaleTimeString('tr-TR');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Dashboard verilerini yükle
        async function loadDashboard() {
            try {
                // Bugünkü satışlar
                const salesRes = await fetch(`${API_URL}/dashboard/sales_today`);
                const salesData = await salesRes.json();

                document.getElementById('today-sales').textContent = `${salesData.today_sales.toFixed(2)} ₺`;
                document.getElementById('today-profit').textContent = `${salesData.today_profit.toFixed(2)} ₺`;
                document.getElementById('today-transactions').textContent = salesData.today_transactions;

                const change = salesData.sales_change;
                const changeEl = document.getElementById('sales-change');
                if (change > 0) {
                    changeEl.textContent = `↑ %${change.toFixed(1)}`;
                    changeEl.className = 'text-sm font-bold text-green-600';
                } else if (change < 0) {
                    changeEl.textContent = `↓ %${Math.abs(change).toFixed(1)}`;
                    changeEl.className = 'text-sm font-bold text-red-600';
                } else {
                    changeEl.textContent = '—';
                    changeEl.className = 'text-sm font-bold text-gray-400';
                }

                // Az kalanlar
                const lowStockRes = await fetch(`${API_URL}/dashboard/low_stock?threshold=10`);
                const lowStockData = await lowStockRes.json();

                document.getElementById('low-stock-count').textContent = lowStockData.length;

                const lowStockList = document.getElementById('low-stock-list');
                if (lowStockData.length === 0) {
                    lowStockList.innerHTML = '<p class="text-gray-400 text-sm">Tüm ürünler yeterli!</p>';
                } else {
                    lowStockList.innerHTML = lowStockData.map(item => {
                        const color = item.stock === 0 ? 'red' : item.stock < 5 ? 'orange' : 'yellow';
                        return `
                            <div class="flex justify-between items-center p-2 bg-${color}-50 rounded">
                                <span class="text-sm font-medium">${item.name}</span>
                                <span class="text-xs font-bold text-${color}-600">${item.stock === 0 ? 'Bitti!' : item.stock + ' kaldı'}</span>
                            </div>
                        `;
                    }).join('');
                }

                // En çok satanlar
                const topSellingRes = await fetch(`${API_URL}/dashboard/top_selling?days=1`);
                const topSellingData = await topSellingRes.json();

                const topSellingList = document.getElementById('top-selling-list');
                if (topSellingData.length === 0) {
                    topSellingList.innerHTML = '<p class="text-gray-400 text-sm">Henüz satış yok</p>';
                } else {
                    topSellingList.innerHTML = topSellingData.map((item, index) => `
                        <div class="flex justify-between items-center p-2 hover:bg-gray-50 rounded">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-gray-400">${index + 1}.</span>
                                <span class="text-sm font-medium">${item.name}</span>
                            </div>
                            <span class="text-xs font-bold text-blue-600">${item.quantity} adet</span>
                        </div>
                    `).join('');
                }

            } catch (error) {
                console.error('Dashboard yüklenemedi:', error);
            }
        }

        // Son satışları yükle
        async function loadRecentSales() {
            try {
                const res = await fetch(`${API_URL}/sales/recent?limit=10`);
                const sales = await res.json();

                const tableBody = document.getElementById('recent-sales-table');
                if (sales.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-gray-400">Henüz satış yok</td></tr>';
                } else {
                    tableBody.innerHTML = sales.map(sale => {
                        const time = new Date(sale.created_at);
                        return `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="px-4 py-3 text-sm">${sale.product_name}</td>
                                <td class="px-4 py-3 text-sm">${sale.quantity}</td>
                                <td class="px-4 py-3 text-sm font-semibold text-blue-600">${sale.total_price.toFixed(2)} ₺</td>
                                <td class="px-4 py-3 text-sm font-semibold text-green-600">${sale.profit.toFixed(2)} ₺</td>
                                <td class="px-4 py-3 text-xs text-gray-500">${time.toLocaleTimeString('tr-TR')}</td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Son satışlar yüklenemedi:', error);
            }
        }

        // Sayfa yüklendiğinde
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            loadRecentSales();

            // 30 saniyede bir otomatik güncelle
            setInterval(() => {
                loadDashboard();
                loadRecentSales();
            }, 30000);
        });
    </script>
</body>
</html>
