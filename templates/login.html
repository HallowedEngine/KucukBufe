<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BüfeOS - Giriş Yap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-green-500 to-blue-600 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">

        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <i class="fas fa-store text-6xl text-green-600 mb-4"></i>
            <h1 class="text-3xl font-bold text-gray-800">BüfeOS'a Giriş</h1>
            <p class="text-gray-600 mt-2">Büfenizi yönetmeye devam edin</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">

            <!-- Username/Email -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fas fa-user mr-2"></i>Kullanıcı Adı veya Email
                </label>
                <input
                    type="text"
                    id="username"
                    required
                    placeholder="ahmet_bufe"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                    autofocus
                >
            </div>

            <!-- Şifre -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fas fa-lock mr-2"></i>Şifre
                </label>
                <input
                    type="password"
                    id="password"
                    required
                    placeholder="••••••••"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                >
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-600">
                    <input type="checkbox" class="mr-2">
                    Beni Hatırla
                </label>
                <a href="#" class="text-green-600 hover:underline">Şifremi Unuttum</a>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-green-600 to-blue-600 text-white py-4 rounded-lg font-bold text-lg hover:from-green-700 hover:to-blue-700 transition transform hover:scale-105"
            >
                <i class="fas fa-sign-in-alt mr-2"></i>
                Giriş Yap
            </button>

        </form>

        <!-- Register Link -->
        <div class="mt-6 text-center">
            <p class="text-gray-600">
                Henüz hesabınız yok mu?
                <a href="register.html" class="text-green-600 font-semibold hover:underline">Kayıt Ol - 30 Gün Ücretsiz!</a>
            </p>
        </div>

        <!-- Divider -->
        <div class="mt-8 pt-6 border-t text-center">
            <p class="text-xs text-gray-500">
                <i class="fas fa-lock mr-1"></i>
                Güvenli bağlantı ile giriş yapıyorsunuz
            </p>
        </div>

    </div>

    <!-- JavaScript -->
    <script>
        const API_URL = window.location.origin;

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // Basic Auth ile giriş
                const credentials = btoa(`${username}:${password}`);

                const response = await fetch(`${API_URL}/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Basic ${credentials}`
                    }
                });

                if (response.ok) {
                    const user = await response.json();

                    // Credentials'ı localStorage'a kaydet (production'da JWT kullan!)
                    localStorage.setItem('auth', credentials);
                    localStorage.setItem('user', JSON.stringify(user));

                    alert(`🎉 Hoş geldin ${user.bufe_adi}!`);

                    // Ana panele yönlendir
                    window.location.href = 'index.html';

                } else {
                    const error = await response.json();
                    alert('❌ Giriş başarısız: ' + error.detail);
                }

            } catch (error) {
                alert('❌ Bağlantı hatası: ' + error.message);
            }
        });

        // Zaten giriş yapmış mı kontrol et
        if (localStorage.getItem('auth')) {
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
